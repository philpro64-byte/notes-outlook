<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mémo vocal</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
body{font:14px "Segoe UI",system-ui,sans-serif;margin:0;padding:16px;color:#242424;background:#fff}
@media (prefers-color-scheme:dark){body{color:#f0f0f0;background:#1f1f1f}}
#txt{min-height:150px;max-height:260px;overflow:auto;border:1px solid #888;border-radius:6px;padding:8px;margin:10px 0;white-space:pre-wrap}
.i{opacity:.55}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid #888;background:transparent;color:inherit;cursor:pointer;margin-right:6px}
button.p{background:#5b5fc7;border-color:#5b5fc7;color:#fff}
#st{font-size:12px;opacity:.8;min-height:16px}
.rec{color:#c4314b;font-weight:600}
</style></head><body>
<div><button class="p" id="tg">🎙 Démarrer</button><button id="ok">Terminer et insérer</button></div>
<div id="txt"></div>
<div id="st"></div>
<script>
Office.onReady(()=>{
  const $=id=>document.getElementById(id);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const st=t=>$("st").textContent=t;
  if(!SR){st("Dictée non prise en charge par ce navigateur : utilisez Edge ou Chrome.");$("tg").disabled=true;return}
  const rec=new SR();rec.lang="fr-FR";rec.continuous=true;rec.interimResults=true;
  let segs=[],interim="",on=false;
  const render=()=>{const t=$("txt");t.textContent=segs.join("\n");
    if(interim){const s=document.createElement("span");s.className="i";s.textContent=(segs.length?"\n":"")+interim;t.appendChild(s)}
    t.scrollTop=t.scrollHeight};
  rec.onresult=e=>{interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
      if(r.isFinal){const s=r[0].transcript.trim();if(s)segs.push(s)}else interim+=r[0].transcript}
    render()};
  rec.onerror=e=>{if(e.error==="no-speech")return;
    st(e.error==="not-allowed"?"Micro refusé : autorisez-le (icône dans la barre d'adresse) puis réessayez.":"Erreur : "+e.error);
    on=false;$("tg").textContent="🎙 Reprendre"};
  rec.onend=()=>{if(on){try{rec.start()}catch(e){}}};
  $("tg").onclick=()=>{
    if(on){on=false;rec.stop();$("tg").textContent="🎙 Reprendre";st("En pause.")}
    else{on=true;try{rec.start()}catch(e){}$("tg").textContent="⏸ Pause";st("");$("st").innerHTML='<span class="rec">● Enregistrement…</span>'}};
  $("ok").onclick=()=>{on=false;try{rec.stop()}catch(e){}
    if(interim.trim())segs.push(interim.trim());
    Office.context.ui.messageParent(JSON.stringify({segs}))};
});
</script></body></html>
